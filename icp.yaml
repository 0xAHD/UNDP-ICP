# UNDP AltFinLab Cohort Tracker — RAW ICP track.
#
# LOCAL ONLY at this phase. No engine or mainnet environment is defined here
# on purpose: deploying the `registry` canister mints its permanent credential
# DID, and that step is gated on a second controller being in place.
# See CLAUDE.md, "Deploy gate".

canisters:
  - name: ops
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  - name: registry
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  # Public credential verification page. Served by the certified-assets
  # canister, which sets the `ic_env` cookie carrying the root key and canister
  # ids — so the page never calls fetchRootKey() and needs no environment
  # branching (canister-security pitfall 7).
  - name: verify_page
    recipe:
      type: "@dfinity/static-site@v0.3.3"
      configuration:
        dir: verify-page/dist
        build:
          - npm --prefix verify-page install
          - npm --prefix verify-page run build

  # Internal ops console: cohorts, completion rules, credential status.
  # Admin actions authenticate with Internet Identity, but the canisters do the
  # real authorisation — this page only decides what to SHOW. Issuing is
  # deliberately absent: it needs the issuer private key, which is held off
  # chain and must never reach a browser.
  - name: ops_console
    recipe:
      type: "@dfinity/static-site@v0.3.3"
      configuration:
        dir: ops-console/dist
        build:
          - npm --prefix ops-console install
          - npm --prefix ops-console run build

networks:
  - name: local
    mode: managed

environments:
  - name: local
    network: local
    canisters: [ops, registry, verify_page, ops_console]
